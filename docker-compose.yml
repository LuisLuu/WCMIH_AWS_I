services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: project_v_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: project_v
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d project_v"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: project_v_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3001
      CLIENT_URL: http://localhost:5174
      DATABASE_URL: postgresql://postgres:mysecretpassword@postgres:5432/project_v
      JWT_SECRET: local-dev-jwt-secret-key-change-in-prod
      LOCAL_KMS_KEY: local-dev-kms-master-key-32bytes
    ports:
      - "3001:3001"
    volumes:
      - ./server:/app
      - /app/node_modules

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: project_v_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "5174:5173"
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  pgdata:
