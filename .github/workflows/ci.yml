name: Project V CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server-checks:
    name: Server Syntax, ESM Imports & Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mysecretpassword
          POSTGRES_DB: project_v
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run database migrations and seed
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:mysecretpassword@localhost:5432/project_v
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Run unified test suite (syntax, ESM imports & unit tests)
        working-directory: server
        env:
          PORT: 3001
          CLIENT_URL: http://localhost:5174
          DATABASE_URL: postgresql://postgres:mysecretpassword@localhost:5432/project_v
          JWT_SECRET: ci-test-jwt-secret-key
          LOCAL_KMS_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: npm test

      - name: Verify API server boots & Auth endpoints pass
        working-directory: server
        env:
          PORT: 3001
          CLIENT_URL: http://localhost:5174
          DATABASE_URL: postgresql://postgres:mysecretpassword@localhost:5432/project_v
          JWT_SECRET: ci-test-jwt-secret-key
          LOCAL_KMS_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: |
          node index.js &
          SERVER_PID=$!
          sleep 3
          curl -f http://localhost:3001/api/health
          npm run test:auth
          kill $SERVER_PID

  client-build:
    name: Client Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install & build client
        working-directory: client
        run: |
          npm ci
          npm run build
